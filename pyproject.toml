[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "step2html"
dynamic = ["version"]
description = "Turn a STEP assembly into one self-contained interactive HTML file"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["step", "cad", "occt", "webgl", "viewer", "pcb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # OCCT. The only dependency, and the reason a frozen build is large.
    "cadquery-ocp>=7.7",
]

[project.scripts]
step2html = "step_to_html:main"

[project.gui-scripts]
step2html-gui = "gui:main"

[tool.setuptools.dynamic]
# One place for the number, and it is the source file. Repeating it
# here is how the two drift apart.
version = { attr = "step_to_html.__version__" }

[tool.setuptools]
# Flat modules on purpose. step_to_html.py is the whole pipeline and can
# still be copied anywhere on its own; gui.py and worker.py sit beside it
# and are only needed for the window.
py-modules = ["step_to_html", "gui", "worker"]
