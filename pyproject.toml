[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "step2html"
dynamic = ["version"]
description = "Turn a STEP assembly into one self-contained interactive HTML file"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["step", "cad", "occt", "webgl", "viewer", "pcb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # OCCT, and the reason a frozen build is large. Below 9 on purpose: 8.0.1
    # arrived in September 2026 with three renamed bindings and broke 0.14.0
    # at import for everyone who installed that month, because nothing here
    # said which majors had been tried. 7.7 to 8.0 have; the next one gets
    # tried here before it can land on a user.
    "cadquery-ocp>=7.7,<9",
    # The arrays behind the normals and the payload. It arrives with
    # cadquery-ocp anyway - through vtk and matplotlib - but a transitive
    # dependency is nobody's promise, so it is declared here.
    "numpy>=1.20",
]

[project.scripts]
step2html = "step2html.cli:main"

[project.gui-scripts]
step2html-gui = "step2html.gui.app:main"

[tool.setuptools.dynamic]
# One place for the number, and it is the package itself. Repeating it
# here is how the two drift apart.
version = { attr = "step2html.__version__" }

[tool.setuptools]
# One package, one module per concern - docs/architecture.md says which is
# which. It used to be three flat modules, and two of them were called gui
# and worker: names that general, installed at the top level, are a
# collision waiting for a machine with one more package on it.
packages = ["step2html", "step2html.gui"]

[tool.setuptools.package-data]
# The page template: markup, stylesheet and script, read at import by
# page.py. Data, not code, and it has to travel with the package.
step2html = ["viewer/*"]
